<body>
<canvas id="bg-fx" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-yt" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 9.6l4.6 2.4-4.6 2.4z" fill="currentColor"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M4.5 4.5l15 15M19.5 4.5l-15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-th" viewBox="0 0 24 24"><path d="M12.2 21c-4.8 0-7.9-3.1-7.9-9s3.1-9 7.9-9c3.9 0 6.7 2.1 7.4 5.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16.9 13.6c.2-2.8-1.5-4.6-4.1-4.6-2.5 0-4.3 1.8-4.3 4.4 0 2.7 1.8 4.5 4.3 4.5 1.5 0 2.6-.6 3.2-1.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>

<header class="bar" data-od-id="status-bar">
  <div class="bar-inner">
    <span class="prompt" id="bar-prompt">lupinenes@home</span>
    <span class="bar-shell dim">~</span>
    <span class="bar-shell pct">%</span>
    <span class="bar-shell dim">cat</span>
    <span class="bar-shell">profile.txt</span>
    <span class="bar-shell dim">·</span>
    <span class="bar-statlabel dim">status:</span>
    <span class="sdot" aria-hidden="true"></span>
    <span class="slabel" id="bar-status">online</span>
    <span class="bar-act" id="bar-act" hidden></span>
    <span class="caret" aria-hidden="true"></span>
    <button class="copy" data-od-id="copy-url" type="button">copy url</button>
    <div class="lang-switch" id="lang-switch" role="group" aria-label="language" data-od-id="lang-switch"></div>
  </div>
</header>

<main class="wrap">
  <section class="idcard" data-od-id="id-card">
    <div class="ibanner" data-od-id="banner" id="banner"></div>
    <div class="irow">
      <div class="avatar" data-od-id="avatar" id="avatar">
        <span class="fallback" id="avatar-fallback" hidden>LE</span>
        <img id="avatar-img" alt="LupinEnes avatar" width="172" height="172">
        <span class="presence" id="presence" title="online"></span>
      </div>
      <div class="iname">
        <h1 id="name">LupinEnes</h1>
        <p class="istatus" id="tagline"></p>
        <div class="now" id="now" hidden>
          <img class="now-art" id="now-art" alt="" hidden>
          <span class="now-txt">
            <span class="now-l" id="now-label"></span>
            <span class="now-m" id="now-main"></span>
            <span class="now-s" id="now-sub"></span>
          </span>
        </div>
      </div>
    </div>
  </section>

  <section class="about" data-od-id="about">
    <span class="alabel" id="about-label">About</span>
    <p class="atext" id="about-text"></p>
  </section>

  <div id="sections-wrap"></div>

  <div class="grid" id="log-grid"></div>

  <footer class="socials" data-od-id="socials">
    <div class="chips" id="socials-chips"></div>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/app.js" defer></script>
</body>
</html>
